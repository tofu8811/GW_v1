services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      GATEWAY_NODE: ${GATEWAY_NODE:-gateway-api-1}
      LOG_FILE: ${LOG_FILE:-logs/gateway.jsonl}
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_password}@postgres:5432/${POSTGRES_DB:-gateway_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CONFIG_SCHEMA_VERSION: ${CONFIG_SCHEMA_VERSION:-2}
      CONFIG_POLL_INTERVAL_SECONDS: ${CONFIG_POLL_INTERVAL_SECONDS:-20}
      CONFIG_TTL_SECONDS: ${CONFIG_TTL_SECONDS:-0}
      CONFIG_REBUILD_LOCK_TTL_SECONDS: ${CONFIG_REBUILD_LOCK_TTL_SECONDS:-10}
      CONFIG_REBUILD_LOCK_WAIT_SECONDS: ${CONFIG_REBUILD_LOCK_WAIT_SECONDS:-2}
      CORS_SOURCE: ${CORS_SOURCE:-policy}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-10s}
      HEALTH_PROBE_TIMEOUT: ${HEALTH_PROBE_TIMEOUT:-2s}
      HEALTH_UNHEALTHY_THRESHOLD: ${HEALTH_UNHEALTHY_THRESHOLD:-3}
      HEALTH_HEALTHY_THRESHOLD: ${HEALTH_HEALTHY_THRESHOLD:-2}
      HEALTH_KEY_TTL: ${HEALTH_KEY_TTL:-30s}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_OPEN_TIMEOUT: ${BREAKER_OPEN_TIMEOUT:-15s}
      BREAKER_HALFOPEN_MAX: ${BREAKER_HALFOPEN_MAX:-1}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_local_env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-gateway}:${RABBITMQ_DEFAULT_PASS:-gateway_password}@rabbitmq:5672/
      RABBITMQ_LOG_EXCHANGE: ${RABBITMQ_LOG_EXCHANGE:-gateway.logs.exchange}
      RABBITMQ_LOG_QUEUE: ${RABBITMQ_LOG_QUEUE:-gateway.logs.queue}
      RABBITMQ_LOG_ROUTING_KEY: ${RABBITMQ_LOG_ROUTING_KEY:-gateway.request.completed}
      RABBITMQ_LOG_DLX: ${RABBITMQ_LOG_DLX:-gateway.logs.dlx}
      RABBITMQ_LOG_DLQ: ${RABBITMQ_LOG_DLQ:-gateway.logs.dlq}
      RABBITMQ_PUBLISH_TIMEOUT: ${RABBITMQ_PUBLISH_TIMEOUT:-500ms}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_LOG_INDEX_PREFIX: ${ELASTICSEARCH_LOG_INDEX_PREFIX:-gateway-logs}
    volumes:
      - ../logs:/app/logs
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  caddy:
    image: caddy:2-alpine
    container_name: gateway-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDY_CONFIG_FILE:-../Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - gateway_caddy_data:/data
      - gateway_caddy_config:/config
    depends_on:
      - gateway
  postgres:
    image: postgres:16
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateway_db}
      POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: gateway-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    volumes:
      - gateway_pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7
    container_name: gateway-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - gateway_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gateway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-gateway}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-gateway_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - gateway_rabbitmq_data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: gateway-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - gateway_elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: gateway-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  gateway_caddy_data:
  gateway_caddy_config:
  gateway_postgres_data:
  gateway_pgadmin_data:
  gateway_redis_data:
  gateway_rabbitmq_data:
  gateway_elasticsearch_data:
